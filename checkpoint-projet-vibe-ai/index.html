<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie de Produits</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <h1 class="logo">🛍️ Ma Galerie</h1>
    <button id="theme-toggle" class="theme-btn" aria-label="Changer de thème">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
  </header>

  <main class="gallery">
    <article class="card fade-in">
      <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600')"></div>
      <div class="card-body">
        <h2 class="card-title">Sneakers Sport</h2>
        <p class="card-desc">Confort et style pour toutes vos aventures quotidiennes.</p>
        <div class="card-footer">
          <span class="price">89,99 €</span>
          <button class="btn-buy">Acheter</button>
        </div>
      </div>
    </article>

    <article class="card fade-in">
      <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600')"></div>
      <div class="card-body">
        <h2 class="card-title">Casque Audio</h2>
        <p class="card-desc">Son immersif et réduction de bruit active premium.</p>
        <div class="card-footer">
          <span class="price">199,00 €</span>
          <button class="btn-buy">Acheter</button>
        </div>
      </div>
    </article>

    <article class="card fade-in">
      <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600')"></div>
      <div class="card-body">
        <h2 class="card-title">Montre Connectée</h2>
        <p class="card-desc">Suivi santé, notifications et design élégant.</p>
        <div class="card-footer">
          <span class="price">249,50 €</span>
          <button class="btn-buy">Acheter</button>
        </div>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
